services:
  ai-toolbox:
    build: .
    container_name: ai-toolbox
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
      HOST_PORT: ${HOST_PORT:-8010}
      UPLOAD_DIR: ${UPLOAD_DIR:-/tmp/ai-toolbox/uploads}
      RESULT_DIR: ${RESULT_DIR:-/tmp/ai-toolbox/results}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      UPLOAD_RETENTION_HOURS: ${UPLOAD_RETENTION_HOURS:-24}
      RESULT_RETENTION_HOURS: ${RESULT_RETENTION_HOURS:-24}
      CLEANUP_INTERVAL_MINUTES: ${CLEANUP_INTERVAL_MINUTES:-60}
      YOUTUBE_MAX_DOWNLOAD_MB: ${YOUTUBE_MAX_DOWNLOAD_MB:-500}
      YOUTUBE_MAX_DURATION_SECONDS: ${YOUTUBE_MAX_DURATION_SECONDS:-7200}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8010}:${APP_PORT:-8000}"
    volumes:
      - ./uploads:/tmp/ai-toolbox/uploads
      - ./results:/tmp/ai-toolbox/results
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os, urllib.request;
          urllib.request.urlopen('http://127.0.0.1:' +
          os.getenv('APP_PORT', '8000') + '/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
